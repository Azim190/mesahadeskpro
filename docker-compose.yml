version: '3.8'

services:
  masahadesk-all-in-one:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masahadesk-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - JWT_SECRET=change_this_in_production_secret_key_12345
      - DATABASE_URL=file:/app/apps/backend/masahadesk_prod.db
    volumes:
      - masahadesk-data:/app/apps/backend

volumes:
  masahadesk-data:
